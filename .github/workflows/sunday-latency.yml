name: sunday-latency
# Watches the deployed board through a full NFL Sunday and commits the latency report to latency/.
# GitHub caps a job at 6 h, so the day is three overlapping runs (times in UTC; Oct 18 2026 is EDT = UTC-4):
#   A 13:15 UTC (9:15 am ET)  for 5.75 h  → international + early window
#   B 18:45 UTC (2:45 pm ET)  for 5.75 h  → late afternoon window
#   C 00:15 UTC (8:15 pm ET)  for 4.00 h  → Sunday Night Football
on:
  schedule:
    - cron: '15 13 18 10 *'
    - cron: '45 18 18 10 *'
    - cron: '15 0 19 10 *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'How long to watch (hours)'
        default: '0.05'
      label:
        description: 'Name for the report file'
        default: 'manual'
permissions:
  contents: write
concurrency:
  group: sunday-latency-${{ github.event.schedule || github.run_id }}
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Only on Oct 18-19 2026 for scheduled runs
        if: github.event_name == 'schedule'
        run: |
          d=$(date -u +%F)
          if [ "$d" != "2026-10-18" ] && [ "$d" != "2026-10-19" ]; then echo "not the target day ($d)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pick duration and file name
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            '15 13 18 10 *') echo "hours=5.75" >> $GITHUB_OUTPUT; echo "label=2026-10-18-a-early" >> $GITHUB_OUTPUT ;;
            '45 18 18 10 *') echo "hours=5.75" >> $GITHUB_OUTPUT; echo "label=2026-10-18-b-late" >> $GITHUB_OUTPUT ;;
            '15 0 19 10 *')  echo "hours=4"    >> $GITHUB_OUTPUT; echo "label=2026-10-18-c-snf" >> $GITHUB_OUTPUT ;;
            *) echo "hours=${{ inputs.hours }}" >> $GITHUB_OUTPUT; echo "label=${{ inputs.label }}" >> $GITHUB_OUTPUT ;;
          esac
      - name: Wake the site
        run: curl -fsS --retry 6 --retry-delay 10 --max-time 90 "${{ vars.APP_URL || 'https://nfl-odds-board.onrender.com' }}/healthz" > /dev/null
      - name: Watch
        run: npx tsx scripts/watch-day.ts "${{ vars.APP_URL || 'https://nfl-odds-board.onrender.com' }}" "${{ steps.plan.outputs.hours }}" "latency/${{ steps.plan.outputs.label }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'latency-${{ steps.plan.outputs.label }}', path: latency/, if-no-files-found: ignore }
      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latency/ || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Latency report: ${{ steps.plan.outputs.label }}"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
